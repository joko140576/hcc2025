<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Pengisian KPI Pegawai</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .section-title {
            padding: 60px 0;
            text-align: center;
            background: linear-gradient(135deg, #0d6efd, #0a58ca);
            color: white;
        }

        .video-section {
            padding: 60px 0;
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .hover-box:hover {
            background-color: #e9f2ff;
            transform: scale(1.02);
            transition: 0.3s ease;
        }
        .link-box {
                min-width: 300px;
            }

            .link-box:hover {
                background-color: #e9f2ff;
                transform: scale(1.05);
                transition: 0.3s ease;
            }

    </style>
</head>

<body>

    <!-- Section 1 -->
    <section class="section-title">
        <div class="container">
            <h1 class="fw-bold">Video Pengisian KPI Pegawai</h1>
            <p class="lead">Panduan Pengisian KPI PT SSI</p>

        
        <div class="container mt-4 text-center">
            
            <p class="fw-bold">Silakan akses Link KPI di bawah ini:</p>

            <a href="https://kpi-pegawai.vercel.app" 
               target="_blank" 
               class="text-decoration-none d-inline-block">
               
                <div class="px-4 py-3 border rounded-3 shadow-sm bg-light link-box">
                    <span class="text-primary fw-semibold">
                        🌐 KPI Pegawai
                    </span>
                </div>
            </a>
        </div>

    </section>

    <!-- Section 2 -->
    <section class="video-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="video-container">
                        <iframe 
                            src="https://drive.google.com/file/d/1rL8ALIFJ5RVW_zNjhMAKiO6_sLxB__Si/preview" 
                            allow="autoplay">
                        </iframe>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>
</html>
